# Tools the Claude Code hook can map to. Copy to .agents/tool-registry.yaml and adjust.
# Anything not listed here (including every MCP tool) is denied by the gate.
- id: fs.read
  source: native
  version: "1"
  risk: read
  effect: read-only
  data_class: internal
  allowed_roles: [builder, reviewer, analyst]
  environments: [dev]
  approval: auto
  owner: platform-team
