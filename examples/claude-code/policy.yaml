# A starting policy for the Claude Code hook. Copy to .agents/policy.yaml and adjust.
# The most restrictive matching rule wins; anything unmatched goes to a human.
schema_version: 1
version: claude-code-0.1.0
default: human

# Approvals (ADR 0009, ADR 0010). With require_signatures an approval is an SSH signature and the
# approver is whoever .agents/allowed-signers names for the key, not a name someone typed. Enforce
# mode needs this. List the people allowed to approve under `approvers` as well.
approvals:
  require_signatures: true
  hardware_key_for_four_eyes: false   # set true once approvers of no-go zones have a security key
  max_scope_hours: 24

# Limits counted from the ledger. A tripped limit sends the call to a human (on_exceed: deny stops
# it outright). Tune these from `agentctl hook report` before enforcing: re-running the same test
# command on the same paths looks like a loop, so keep the threshold generous.
budgets:
  max_calls_per_task: 500
  max_calls_per_day: 3000
  loop_threshold: 15
  loop_window: 40
  on_exceed: human

# Unusual behaviour, judged from earlier decisions in the ledger. `alert` only records an
# anomaly_detected event; `human` pauses the call for a person; `deny` stops it.
anomalies:
  max_denials: 5          # 5 denials among the task's last 20 decisions, however they vary
  denial_window: 20
  new_tool: true          # a never-used tool at medium risk or above, once there is a baseline
  new_tool_min_history: 50
  burst_calls: 60         # 60 calls by one task within a minute
  burst_seconds: 60
  new_domain: true        # a call that names a host no earlier call named, once there is a baseline
  new_domain_min_history: 20
  max_call_bytes: 200000  # one call to a tool that sends data outward carrying more than 200 KB
  max_task_bytes: 2000000 # a task that has sent more than 2 MB outward in total
  on_anomaly: human

auto_approve:
  - id: reads
    description: Reading files, searching and read-only shell commands
    when:
      tools: ["fs.read", "shell.read", "claude.internal"]
  - id: edits-in-project
    description: Edits of up to 400 lines to source, tests and documentation
    when:
      tools: ["fs.write"]
      paths: ["src/**", "tests/**", "docs/**", "examples/**", "README.md", "CONTRIBUTING.md"]
      # Cumulative for the task, and the Claude Code hook treats a whole session as one task, so a
      # long session passes this and every later edit asks. This repository raised it to 2000
      # (docs/adr/0015-prompt-rate-decisions.md); pick the number that suits how long yours run.
      max_diff_lines: 400
  - id: test-runs
    description: Running the project's tests and linters
    when:
      tools: ["shell.test"]
  - id: subagents
    description: Starting a subagent (its own tool calls are checked separately)
    when:
      tools: ["agent.spawn"]

council_review:
  - id: web-access
    description: Fetching web content can bring in untrusted instructions or send data out
    when:
      tools: ["web.fetch"]

human_required:
  - id: framework-and-claude-config
    description: Policy, hook configuration, CI and dependency files decide what agents may do
    when:
      paths: [".agents/**", ".claude/**", ".github/**", "pyproject.toml", "uv.lock"]
  - id: arbitrary-shell
    description: A shell command that is not a recognised read or test command
    when:
      tools: ["shell.run"]
  - id: writes-after-untrusted-content
    description: A session that read untrusted content may not change anything without a human
    when:
      tainted: true
      risk_at_least: low

never:
  - id: secrets
    description: Agents never touch secrets, keys or environment files
    when:
      paths: ["**/.env", "**/.env.*", "**/secrets/**", "**/*.pem", "**/*.key", "**/id_rsa*"]
