# A starting policy for the Claude Code hook. Copy to .agents/policy.yaml and adjust.
# The most restrictive matching rule wins; anything unmatched goes to a human.
schema_version: 1
version: claude-code-0.1.0
default: human

auto_approve:
  - id: reads
    description: Reading files, searching and read-only shell commands
    when:
      tools: ["fs.read", "shell.read", "claude.internal"]
  - id: edits-in-project
    description: Edits to source, tests and documentation, up to 2000 changed lines in all per session
    when:
      tools: ["fs.write"]
      paths: ["src/**", "tests/**", "docs/**", "examples/**", "README.md", "CONTRIBUTING.md"]
      # Counted for the whole session (the Claude Code hook treats a session as one task), so it
      # stops a session rewriting thousands of lines in small pieces. It was 400, which a long
      # session passed after 37 of 999 decisions and which then asked about every edit (P2.10a).
      max_diff_lines: 2000
  - id: test-runs
    description: Running the project's tests and linters
    when:
      tools: ["shell.test"]
  - id: subagents
    description: Starting a subagent (its own tool calls are checked separately)
    when:
      tools: ["agent.spawn"]
  - id: app-ui-tools
    description: Claude desktop app tools that only update the task list or ask where to branch
    when:
      tools: ["mcp__ccd_turn__*", "mcp__ccd_directory__propose_branch"]

council_review:
  - id: web-access
    description: Fetching web content can bring in untrusted instructions or send data out
    when:
      tools: ["web.fetch"]

human_required:
  - id: framework-and-claude-config
    description: Policy, hook configuration, CI and dependency files decide what agents may do
    when:
      paths: [".agents/**", ".claude/**", ".github/**", "pyproject.toml", "uv.lock"]
  - id: arbitrary-shell
    description: A shell command that is not a recognised read or test command
    when:
      tools: ["shell.run"]
  - id: writes-after-untrusted-content
    description: A session that read untrusted content may not change anything without a human
    when:
      tainted: true
      risk_at_least: low

never:
  - id: secrets
    description: Agents never touch secrets, keys or environment files
    when:
      paths: ["**/.env", "**/.env.*", "**/secrets/**", "**/*.pem", "**/*.key", "**/id_rsa*"]
