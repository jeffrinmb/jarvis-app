name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest is migrating from 24.04 to 26.04 (rollout Oct 19 to Nov 19, 2026).
        # Test both explicitly; drop ubuntu-24.04 after the migration finishes.
        os: [ubuntu-24.04, ubuntu-26.04, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install uv==0.12.9
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest

  # Single required check for branch protection. It passes only if every matrix job
  # passed, so the ruleset never needs editing when the matrix changes. `always()`
  # makes it run (and fail) even when a test job failed; a skipped required check
  # could otherwise be treated as passing. If more jobs or workflows are added,
  # add them to `needs`.
  ci-ok:
    name: ci-ok
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless all required jobs succeeded
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          echo "test: $TEST_RESULT"
          if [ "$TEST_RESULT" != "success" ]; then
            echo "A required job did not succeed."
            exit 1
          fi

